function guessExamName(){const s=load('settings',{})||{};const m=new Date().getMonth()+1;
 const t=(m>=5&&m<=7)?'期末考试':((m>=10&&m<=12)?'期中考试':'阶段考试');return (s.grade||'')+t;}
function importScoresRows(rows){
 if(!rows||rows.length<2){toast('表格无数据');return;}
 const head=rows[0].map(c=>String(c==null?'':c).trim());
 const SKIP=/^(序号|编号|学号|学籍号|全国学籍号|证件号|身份证|准考证|座位号|考号|性别|班级|班别|姓名|学生姓名|学生|名字|总分|合计|总计|平均分|均分|名次|排名|班名次|校名次|年级名次|等第|等级|备注|照片|头像)$/;
 let ni=head.findIndex(c=>/^(姓名|学生姓名|学生|名字|name|Name)$/i.test(c));
 if(ni<0)ni=head.findIndex(c=>/姓名|名字/.test(c));
 if(ni<0)ni=head.findIndex((c,i)=>c&&!/^\d+$/.test(c)&&!SKIP.test(c));
 if(ni<0){toast('未找到「姓名」列，请检查表头（可写“姓名/学生/名字”）');return;}
 const ci=head.findIndex(c=>/班级|班别/.test(c));
 const subs=head.map((c,i)=>({c,i})).filter(o=>o.i!==ni&&o.c&&!SKIP.test(o.c));
 if(!subs.length){toast('未识别到科目列，请确认表头是科目名');return;}
 const classes=[];if(ci>=0)rows.slice(1).forEach(r=>{const v=String(r[ci]==null?'':r[ci]).trim();if(v&&classes.indexOf(v)<0)classes.push(v);});
 const myCls=(load('settings',{})||{}).className||'';
 const guess=classes.find(c=>myCls&&(c===myCls||myCls.indexOf(c)>=0||c.indexOf(myCls)>=0))||classes[0]||'';
 const clsFld=classes.length?('<div class="fld"><label>导入哪个班（表中检测到「班级」列，共 '+classes.length+' 个班）</label><select class="inp" id="impCls"><option value="">全部班级</option>'+classes.map(c=>'<option '+(c==guess?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></div>'):'';
 const fields=subs.map(o=>'<div class="fld" style="display:inline-block;width:47%;margin-right:2%;vertical-align:top"><label>'+esc(o.c)+' 满分</label><input class="inp sm" id="mx_'+o.i+'" type="number" value="'+(SUBMAX[o.c]||100)+'" min="1"></div>').join('');
 modal('<h3>导入成绩表</h3>'
  +'<div class="fld"><label>本次考试名称（同名会覆盖旧数据）</label><input class="inp" id="impExam" value="'+esc(guessExamName())+'"></div>'
  +clsFld
  +'<div class="note" style="margin:6px 0 8px">自动识别到 '+subs.length+' 个科目：<b>'+subs.map(o=>esc(o.c)).join('、')+'</b>。学籍号、班级等无关列已自动忽略；请在下方核对/输入各科满分（可手动修改）。</div>'
  +fields
  +'<div class="acts"><button class="btn lite" onclick="closeModal()">取消</button><button class="btn" id="mxSave">确认导入</button></div>');
 $('#mxSave').onclick=()=>{
  const exam=(($('#impExam')||{}).value||'').trim()||('考试'+todayStr());
  const pickCls=classes.length?(($('#impCls')||{}).value||''):'';
  const mm={};subs.forEach(o=>{mm[o.c]=Math.max(1,+$('#mx_'+o.i).value||SUBMAX[o.c]||100);});
  const em=load('examMax',{})||{};em[exam]=mm;save('examMax',em);
  const all=(load('scores',[])||[]).filter(r=>r.exam!=exam);
  let n=0,ppl=0;
  rows.slice(1).forEach(r=>{const nm=String(r[ni]==null?'':r[ni]).trim();if(!nm||/^(合计|平均|总计|班级平均)/.test(nm))return;
   if(pickCls&&ci>=0&&String(r[ci]==null?'':r[ci]).trim()!=pickCls)return;
   let got=false;
   subs.forEach(o=>{const raw=String(r[o.i]==null?'':r[o.i]).replace(/[^\d.\-]/g,'');if(raw==='')return;const v=parseFloat(raw);
     if(!isNaN(v)){all.push({exam:exam,name:nm,subject:o.c,score:v});n++;got=true;}});
   if(got)ppl++;});
  save('scores',all);closeModal();scExam=exam;scTab='report';scoresPage();
  toast('已导入 '+ppl+' 名学生、'+n+' 条成绩');};
}

/* ============ SVG 图表 ============ */
function barChart(labels,vals,title){const max=Math.max(...Object.values(vals),1);const w=Math.min(680,labels.length*90+40);let bars='';
 labels.forEach((l,i)=>{const v=vals[l];const h=v/max*120;const x=20+i*90;bars+=`<rect x="${x}" y="${150-h}" width="56" height="${h}" rx="5" fill="#2e8bc0"/><text x="${x+28}" y="${146-h}" font-size="11" text-anchor="middle" fill="#23303f">${v.toFixed(0)}</text><text x="${x+28}" y="${168}" font-size="10" text-anchor="middle" fill="#7a8aa0">${esc(l)}</text>`;});
 return '<svg viewBox="0 0 '+w+' 180" width="100%" style="max-width:'+w+'px">'+bars+'</svg>';}
function lineChart(xl,lines){const w=Math.min(680,xl.length*120+50),h=200;const maxY=100;let svg=`<svg viewBox="0 0 ${w} ${h+30}" width="100%" style="max-width:${w}px">`;
 // axes
 svg+=`<line x1="35" y1="10" x2="35" y2="${h}" stroke="#e2e8f0"/><line x1="35" y1="${h}" x2="${w}" y2="${h}" stroke="#e2e8f0"/>`;
 for(let g=0;g<=100;g+=25){const y=10+(1-g/100)*(h-10);svg+=`<line x1="35" y1="${y}" x2="${w}" y2="${y}" stroke="#f0f3f7"/><text x="30" y="${y+3}" font-size="9" text-anchor="end" fill="#aab">${g}</text>`;}
 const cols=['#1f6fb2','#3a9d6e','#e8a33d','#7d5ba6','#d9534f','#2bb3c0'];
 lines.forEach((ln,i)=>{if(!ln.pts.length)return;const col=cols[i%cols.length];const pts=ln.pts.map(p=>[35+(p[0]/(Math.max(xl.length-1,1)))*(w-45),10+(1-p[1]/100)*(h-10)]);
   svg+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.2"/>`;
   pts.forEach(p=>svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${col}"/>`);
   svg+=`<text x="${w-4}" y="${pts[pts.length-1][1]+3}" font-size="10" fill="${col}" text-anchor="end">${esc(ln.su)}</text>`;
 });
 xl.forEach((x,i)=>{const px=35+(i/(Math.max(xl.length-1,1)))*(w-45);svg+=`<text x="${px}" y="${h+16}" font-size="9" text-anchor="middle" fill="#7a8aa0">${esc(x)}</text>`;});
 return svg+'</svg>';}

function donutChart(data){const total=data.reduce((a,b)=>a+b.n,0)||1;const cols=['#1f6fb2','#2e8bc0','#3a9d6e','#e8a33d','#7d5ba6','#2bb3c0','#d9534f','#9aa7b8'];const R=70,C=90;let a0=-Math.PI/2,svg=`<svg viewBox="0 0 180 180" width="100%" style="max-width:200px">`;
 data.forEach((d,i)=>{const ang=d.n/total*Math.PI*2;const a1=a0+ang;const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);const large=ang>Math.PI?1:0;svg+=`<path d="M${C} ${C} L${x0} ${y0} A${R} ${R} 0 ${large} 1 ${x1} ${y1} Z" fill="${cols[i%cols.length]}"/>`;a0=a1;});
 svg+=`<circle cx="${C}" cy="${C}" r="42" fill="#fff"/><text x="${C}" y="${C+4}" font-size="20" text-anchor="middle" fill="#23303f">${total}</text><text x="${C}" y="${C+20}" font-size="10" text-anchor="middle" fill="#7a8aa0">总记录</text></svg>`;return svg;}

function genParentNotice(){
 const raw=$('#pnIn').value.trim();if(!raw){toast('请粘贴学校通知或输入核心词');return;}
 const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const teacher=(load('settings',{}).teacher)||'班主任';const school=load('settings',{}).school||'';
 const bullets=lines.map(l=>'• '+l).join('\n');
 const txt='各位家长好！我是'+teacher+'，下面把近期学校相关事项跟大家同步一下，方便咱们一起配合把孩子照顾好：\n\n'+bullets+'\n\n以上事项如有不清楚的地方，随时微信我即可。感谢各位家长一直以来的支持与配合！\n\n——'+teacher+(school?'（'+school+'）':'');
 $('#pnOut').value=txt;$('#pnTip').textContent='已生成家长版，可直接复制发群';toast('家长版已生成');
}
function genReport(){
 const id=$('#hsStudent').value;const st=stuById(id);const name=st?st.name:'';
 const start=$('#hsStart').value,end=$('#hsEnd').value;
 // 成绩
 const sc=load('scores',[]).filter(r=>r.name==name);const exams=[...new Set(sc.map(r=>r.exam))];
 let learn='';let weak=[];
 if(sc.length){const last=exams[exams.length-1],prev=exams[exams.length-2];
   const lastRecs=sc.filter(r=>r.exam==last);const lastSum=zkSum(lastRecs);
   const subs=[...new Set(lastRecs.map(r=>r.subject))];
   weak=subs.map(su=>{const arr=sc.filter(r=>r.subject==su).map(r=>r.score/(maxOf(last,su)||100)*100);return {su,avg:arr.reduce((a,b)=>a+b,0)/arr.length};}).sort((a,b)=>a.avg-b.avg).slice(0,2);
   let trend='';const fullMax=zkFullMax(last,subs);
   if(prev){const pSum=zkSum(sc.filter(r=>r.exam==prev));const d=lastSum-pSum;trend='较上次（'+prev+'）总分'+(d>=0?'上升 ':'下降 ')+Math.abs(d)+' 分。';}
   learn=`这次「${last}」，孩子中考总分考了 ${lastSum} 分（满分约 ${fullMax} 分）。${trend}整体看，${weak.length?('「'+weak.map(w=>w.su).join('、')+'」这几门还可以再加把劲，多打打基础'):'各科都挺稳的，没有明显短板'}。`;
 }else learn='暂未录入该生考试成绩，建议补充成绩数据以生成学习分析。';
 // 行规
 const viol=load('violation',[]).filter(r=>r.student==name&&r.date>=start&&r.date<=end);
 const talk=load('talk',[]).filter(r=>r.student==name&&r.date>=start&&r.date<=end);
 const visit=load('visit',[]).filter(r=>r.student==name&&r.date>=start&&r.date<=end);
 const leave=load('leave',[]).filter(r=>r.student==name&&r.start>=start&&r.start<=end);
 const rule=[];

   byT[tk].sub.add(L.s);byT[tk].n++;byT[tk].slots.push(d+'·'+(p=='早读'||p=='午自习'||p=='课后服务'?p:'第'+p+'节'));

function bindDutyDrag(tasks){

 grid.addEventListener('dragover',e=>{if(_dutyDrag&&_dutyDrag.type==='pos')e.preventDefault();});
 grid.addEventListener('drop',e=>{if(!(_dutyDrag&&_dutyDrag.type==='pos'))return;const target=e.target.closest('.pos-cell');if(!target)return;const to=+target.dataset.pos;if(to===_dutyDrag.idx)return;const ts=load('dutyTasks',[]);const t=ts.splice(_dutyDrag.idx,1)[0];ts.splice(to,0,t);save('dutyTasks',ts);dutyPage();});

/* ============ 排座位（自由布局 + 多人桌 + 走道 + 拖拽调换） ============ */
let seatEdit=false;let D={};
function seatingPage(){
 const s=load('seats',defSeats());
 const h=`<div class="card">
   <div class="page-head"><h2>排座位</h2>
     <div class="head-actions">
       <button class="btn ${seatEdit?'warn':''}" id="seatEditBtn">${seatEdit?'完成编辑 ✓':'编辑座位'}</button>
       <button class="btn lite" onclick="seatFill()">按名单排满</button>
       <button class="btn lite" onclick="seatClear()">清空座位</button>
       <button class="btn lite" onclick="seatReset()">重置布局</button>
     </div></div>
   <div class="seat-tools">行数 <input class="inp sm" id="seatRows" type="number" value="${s.rows}" min="1" max="12"> 列数 <input class="inp sm" id="seatCols" type="number" value="${s.cols}" min="1" max="12"> <button class="btn sm" onclick="seatApply()">应用行列</button></div>
   <div class="seat-tools">走道列（点击切换，灰色为走道）：<span id="aisleBox">${aisleChips(s)}</span></div>
   ${seatEdit?'':'<div class="hint">开启「编辑座位」后：① 从下方“未排学生”托盘把名字拖到座位格；② 座位之间拖动可互换/移动；③ 拖回托盘即取消安排。<b>一桌一格，每格 1 人</b>。</div>'}
   <div class="seat-wrap" id="seatWrap"><div class="wall-label">↑ 后墙（教室后方）</div>${renderSeats(s)}<div class="podium">${ic('pod')} 讲台（教室前方 · 学生面朝讲台，老师对照无错位）</div></div>
 </div>`;
 content.innerHTML=h;
 $('#seatEditBtn').onclick=()=>{seatEdit=!seatEdit;seatingPage();};
 $('#seatWrap').addEventListener('pointerdown',e=>{const chip=e.target.closest('.seat-stu');if(!chip||!seatEdit)return;startDrag(e,chip);});
 $$('#aisleBox .chip-toggle').forEach(c=>c.onclick=()=>{const s2=load('seats',defSeats());const cidx=+c.dataset.c;if(s2.aisleBefore.includes(cidx))s2.aisleBefore=s2.aisleBefore.filter(x=>x!=cidx);else s2.aisleBefore.push(cidx);save('seats',s2);seatingPage();});
}
function aisleChips(s){let h='';for(let c=0;c<s.cols;c++){const on=s.aisleBefore.includes(c);h+='<span class="chip-toggle '+(on?'on':'')+'" data-c="'+c+'">第'+(c+1)+'列'+(on?'·走道':'')+'</span>';}return h;}
function renderSeats(s){normSeats(s);const map={};s.desks.forEach(d=>map[d.r+'_'+d.c]=d);
 const assigned=new Set();s.desks.forEach(d=>(d.students||[]).forEach(x=>{if(x)assigned.add(x);}));
 const unassigned=(load('students',[])||[]).filter(x=>!assigned.has(x.id));
 let out='';
 for(let r=0;r<s.rows;r++){let row='<div class="seat-row">';
   for(let c=0;c<s.cols;c++){if(s.aisleBefore.includes(c))row+='<div class="aisle"></div>';
     const d=map[r+'_'+c];if(!d){row+='<div class="desk"></div>';continue;}
     const sid=d.students[0];
     const cells=sid
       ? '<div class="seat-cell" data-desk="'+d.id+'" data-cell="0"><div class="seat-stu" data-stu="'+sid+'" data-desk="'+d.id+'" data-cell="0">'+esc(stuName(sid))+'</div></div>'
       : '<div class="seat-cell" data-desk="'+d.id+'" data-cell="0"><span class="seat-empty">空位</span></div>';
     row+='<div class="desk" data-desk="'+d.id+'">'+cells+'</div>';
   }
   row+='</div>';out+=row;
 }
 if(seatEdit&&unassigned.length)out+='<div class="seat-tray"><span class="lbl">未排学生（拖到空位即可，一桌一人）：</span>'+unassigned.map(x=>'<div class="seat-stu tray" data-stu="'+x.id+'">'+esc(x.name)+'</div>').join('')+'</div>';
 return out;}
function startDrag(e,chip){e.preventDefault();D={id:chip.dataset.stu,from:chip.dataset.desk||'tray',cell:chip.dataset.cell!=null?chip.dataset.cell:null};const g=document.createElement('div');g.className='ghost';g.textContent=stuName(D.id);document.body.appendChild(g);D.ghost=g;moveGhost(e);window.addEventListener('pointermove',seatMove);window.addEventListener('pointerup',seatUp);}
function seatMove(e){if(D.ghost)moveGhost(e);}
function moveGhost(e){D.ghost.style.left=e.clientX+'px';D.ghost.style.top=e.clientY+'px';}
function seatUp(e){window.removeEventListener('pointermove',seatMove);window.removeEventListener('pointerup',seatUp);if(D.ghost){D.ghost.remove();D.ghost=null;}
 const el=document.elementFromPoint(e.clientX,e.clientY);const s=load('seats',defSeats());normSeats(s);
 const cellEl=el&&el.closest('.seat-cell');const trayEl=el&&el.closest('.seat-tray');
 if(cellEl){const t=s.desks.find(d=>d.id==cellEl.dataset.desk);const tc=+cellEl.dataset.cell;
  if(D.from==='tray'){if(t.students[tc]){const bump=t.students[tc];t.students[tc]=D.id;save('seats',s);seatingPage();toast(stuName(bump)+' 回到未排列表');return;}t.students[tc]=D.id;save('seats',s);seatingPage();return;}
  const from=s.desks.find(d=>d.id==D.from);const fc=+D.cell;if(from.id==t.id&&fc==tc){seatingPage();return;}
  const occ=t.students[tc];
  if(occ&&occ!=D.id){t.students[tc]=D.id;from.students[fc]=occ;}
  else{t.students[tc]=D.id;from.students[fc]=null;}
  save('seats',s);seatingPage();return;}
 if(trayEl){const s2=load('seats',defSeats());normSeats(s2);s2.desks.forEach(d=>{const i=d.students.indexOf(D.id);if(i>=0)d.students[i]=null;});save('seats',s2);seatingPage();return;}
 seatingPage();}
function seatApply(){const rows=Math.max(1,Math.min(12,+$('#seatRows').value||6));const cols=Math.max(1,Math.min(12,+$('#seatCols').value||8));const s=load('seats',defSeats());normSeats(s);const flat=[];s.desks.forEach(d=>(d.students||[]).forEach(x=>{if(x)flat.push(x);}));const nd=defSeats();nd.rows=rows;nd.cols=cols;nd.aisleBefore=(s.aisleBefore||[]).filter(x=>x<cols);nd.desks=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)nd.desks.push({id:'d'+r+'_'+c,r,c,students:[null]});let k=0;flat.forEach(sid=>{if(k<nd.desks.length){nd.desks[k].students[0]=sid;k++;}});save('seats',nd);seatingPage();toast(flat.length>nd.desks.length?('座位不足，'+(flat.length-nd.desks.length)+' 人未排，请增加行列'):'已应用新布局');}
function seatReset(){save('seats',defSeats());seatingPage();toast('已重置');}
function seatClear(){if(!confirm('清空所有座位上的学生（保留座位布局）？清空后可在下方“未排学生”托盘把名字拖到空位重新安排。'))return;const s=load('seats',defSeats());s.desks.forEach(d=>d.students=[null]);save('seats',s);seatingPage();toast('已清空，可从托盘重新拖排');}
function seatFill(){const s=load('seats',defSeats());normSeats(s);const ids=(load('students',[])||[]).map(x=>x.id);s.desks.forEach(d=>d.students=[null]);let k=0;s.desks.forEach(d=>{if(k<ids.length){d.students[0]=ids[k];k++;}});save('seats',s);seatingPage();toast(ids.length>s.desks.length?('已排满，还有 '+(ids.length-s.desks.length)+' 人无座，请增加行列'):'已按名单排满（一桌一人）');}

function shareBlank(){try{const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='班主任智慧工作台（空白模板）.html';a.click();toast('已生成空白模板，发给同事即可独立使用');}catch(e){toast('生成失败：'+e.message);}}
function importData(file){const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);Object.keys(obj).forEach(k=>{if(k==='seeded')return;localStorage.setItem(PREFIX+k,JSON.stringify(obj[k]));});toast('导入成功，即将刷新');setTimeout(()=>location.reload(),600);}catch(e){toast('文件格式错误');}};rd.readAsText(file);}
function clearAll(){if(!confirm('确定清空全部数据？此操作不可恢复，请先导出备份！'))return;Object.keys(localStorage).filter(k=>k.startsWith(PREFIX)).forEach(k=>localStorage.removeItem(k));location.reload();}
function clearDemo(){if(!confirm('仅清空预置示例数据（保留你录入的内容）？'))return;['todos','violation','talk','visit','mentor','homework','worklog','safety','schedule','leave'].forEach(k=>save(k,[]));toast('示例已清空');render();}

/* ============ 期末总结（班级建设报告） ============ */
function termSummaryPage(){
 const s=load('settings',{});
 content.innerHTML=`<div class="card"><div class="page-head"><h2>期末总结 · 班级建设报告</h2></div>
   <div class="note" style="margin-bottom:10px">根据平台中已录入的班级荣誉、学生获奖、成绩、违纪、谈话、家访、导师、值日等数据，一键生成班级建设情况总结，供班主任复盘与上报。</div>
   <div class="grid g2">
     <div class="fld"><label>学期 / 学年</label><input class="inp" id="tsSem" value="${esc(s.semester||'')}"></div>
     <div class="fld"><label>报告范围</label><select class="inp" id="tsScope"><option value="sem">本学期</option><option value="year">本学年</option></select></div>
   </div>
   <button class="btn" onclick="genClassReport()">生成班级建设报告</button>
   <div class="sec-title">${ic('log')}报告内容（可直接复制上报 / 存档）</div>
   <textarea id="tsOut" class="inp" style="height:400px;line-height:1.7;font-size:13.5px" placeholder="点击「生成班级建设报告」自动汇总本学期 / 学年班级创建情况…"></textarea>
   <div class="head-actions" style="margin-top:8px"><button class="btn lite" onclick="copyText('tsOut','已复制报告')">复制全文</button><button class="btn lite" onclick="expClassReport()">导出Word</button></div>
 </div>`;
}
function avgTotal(exam){const sc=load('scores',[]).filter(r=>r.exam==exam);const names=[...new Set(sc.map(r=>r.name))];if(!names.length)return 0;return Math.round(names.reduce((a,n)=>a+zkSum(sc.filter(r=>r.name==n)),0)/names.length);}
function genClassReport(){
 const s=load('settings',{});const sem=$('#tsSem').value||s.semester||'';const scope=$('#tsScope').value;
 const st=load('students',[])||[];const boys=st.filter(x=>x.gender=='男').length;
 const honor=load('honor',[])||[];const awards=load('stuAward',[])||[];
 const viol=load('violation',[])||[];const talk=load('talk',[])||[];const visit=load('visit',[])||[];const mentor=load('mentor',[])||[];
 const scores=load('scores',[])||[];const worklog=load('worklog',[])||[];
 const honorByType={};honor.forEach(h=>honorByType[h.type]=(honorByType[h.type]||0)+1);
 const honorTxt=honor.length?Object.entries(honorByType).map(([k,v])=>k+' '+v+' 次').join('、')+'。':'本学期班里的集体荣誉还没登记上，后面可以多带着孩子们冲一冲流动红旗、争个文明班级。';
 const awardTop=awards.filter(a=>a.level=='市级'||a.level=='国家级');
 const awardTxt=awards.length?('共 '+awards.length+' 人次获奖，其中市级及以上 '+awardTop.length+' 人次（如：'+awardTop.slice(0,3).map(a=>a.student+a.name).join('、')+'）。'):'孩子们的个人获奖暂时还没记录，平时可以多吆喝大家参加学科和体艺活动，露露脸、长长自信。';
 let scoreTxt='';let classWeak=[];let fsum=0,lsum=0;
 if(scores.length){const exams=[...new Set(scores.map(r=>r.exam))];const first=exams[0],last=exams[exams.length-1];
   fsum=avgTotal(first);lsum=avgTotal(last);
   const subs=[...new Set(scores.map(r=>r.subject))];
   classWeak=subs.map(su=>{const arr=scores.filter(r=>r.subject==su).map(r=>r.score/(maxOf(last,su)||100)*100);return {su,avg:arr.reduce((a,b)=>a+b,0)/arr.length};}).sort((a,b)=>a.avg-b.avg).slice(0,2);
   scoreTxt='本学期共进行 '+exams.length+' 次主要考试（'+exams.join('、')+'）。班级总分均值从「'+first+'」的 '+fsum+' 分，到「'+last+'」的 '+lsum+' 分（'+(lsum>=fsum?'稳中有升，势头不错':'还有提升空间，咱们一起加把劲')+'）。相对吃力的是'+(classWeak.map(w=>w.su).join('、')||'目前看不出明显短板')+'。';
 }else scoreTxt='暂未录入成绩数据，建议补充以完善学业分析。';
 const violTypes={};viol.forEach(v=>violTypes[v.type]=(violTypes[v.type]||0)+1);
 const ruleTxt='本学期有 '+viol.length+' 起行规上的小事（'+(Object.entries(violTypes).map(([k,v])=>k+' '+v+' 起').join('、')||'无')+'），咱们都是发现一个、跟进一个，教育到位也留了痕，惩和教两手都抓。';
 const mentorTxt='全员导师制不是挂在嘴上的——导师和孩子谈心 '+mentor.length+' 次、家访或家校沟通 '+visit.length+' 次、个别谈话 '+talk.length+' 次，家校两边拧成一股绳，配合得挺顺。';
 const good=[];const bad=[];const sug=[];
 if(honor.length)good.push('班集体的荣誉感特别强，拿下'+honorTxt.replace('。',''));
 if(awards.length)good.push('孩子们发展挺多元，个人获奖就有 '+awards.length+' 人次');
 if(scores.length&&lsum>=fsum)good.push('学业上整体稳中有进，势头不错');
 if(viol.length===0)good.push('行规纪律让人放心，一学期零违纪');
 if(!good.length)good.push('班里日常运转平稳，师生相处也舒服');
 if(classWeak.length)bad.push('学科有点“偏科”，「'+classWeak.map(w=>w.su).join('、')+'」这几门得加把劲');
 if(viol.length>0)bad.push('个别孩子规矩意识还差点意思，得接着慢慢带');
 if(!bad.length)bad.push('一时没看出明显短板，按部就班保持就好');
 sug.push('薄弱学科多搞分层辅导和面批，让导师和课代表多搭把手、结对帮带。');
 sug.push('全员导师制谈心别断档，行规和情绪上的小苗头早发现早谈，家校两头多通气。');
 sug.push('借着流动红旗、文明班级这些评比，把班集体的凝聚力和荣誉感再往上提一提。');
 const teacher=s.teacher||'班主任';const school=s.school||'';
 const txt='【'+(sem||'本学期')+' 班级建设报告】\n班级：'+(s.className||'—')+'　班主任：'+teacher+'　'+school+'\n（范围：'+(scope=='year'?'本学年':'本学期')+'）\n\n一、班级概况\n全班 '+st.length+' 人（男 '+boys+' / 女 '+(st.length-boys)+'），其中本地生源 '+st.filter(x=>x.origin=='本地').length+' 人、外地生源 '+st.filter(x=>x.origin=='外地').length+' 人，配备导师 '+((load('mentorList',[])||[]).length)+' 名，落实上海公办初中全员导师制。\n\n二、荣誉与成果\n1. 集体荣誉：'+honorTxt+'\n2. 学生个人获奖：'+awardTxt+'\n\n三、学业情况\n'+scoreTxt+'\n\n四、行规与德育\n'+ruleTxt+'\n'+mentorTxt+'\n\n五、工作留痕\n本学期共记录班务、家校、心理辅导等工作 '+worklog.length+' 项，值日表常态化运转。\n\n六、好的方面\n'+good.map((g,i)=>(i+1)+'. '+g+'。').join('\n')+'\n\n七、存在的不足\n'+bad.map((g,i)=>(i+1)+'. '+g+'。').join('\n')+'\n\n八、后续改进建议\n'+sug.map((g,i)=>(i+1)+'. '+g).join('\n')+'\n\n——'+teacher+'　'+todayStr();
 $('#tsOut').value=txt;toast('班级建设报告已生成');
}

function genTermReport(){
 const s=load('settings',{});const sem=$('#trSem').value||s.semester||'本学期';
 const st=load('students',[])||[];const boys=st.filter(x=>x.gender=='男').length;
 const honor=load('honor',[])||[];const awards=load('stuAward',[])||[];
 const viol=load('violation',[])||[];const talk=load('talk',[])||[];const visit=load('visit',[])||[];
 const mentor=load('mentor',[])||[];const worklog=load('worklog',[])||[];const safety=load('safety',[])||[];
 const scores=load('scores',[])||[];const dutyRoster=load('dutyRoster',{})||{};const dutyTasks=load('dutyTasks',[])||[];
 const teacher=s.teacher||'班主任';
 const wbCats=worklogCatsInit(),wlByCat={};worklog.forEach(w=>{wlByCat[w.type]=(wlByCat[w.type]||0)+1;});
 const honorByType={};honor.forEach(h=>honorByType[h.type]=(honorByType[h.type]||0)+1);
 const violTypes={};viol.forEach(v=>violTypes[v.type]=(violTypes[v.type]||0)+1);
 const wd=['周一','周二','周三','周四','周五'];let dutyCount=0;dutyTasks.forEach((t,i)=>wd.forEach(d=>{if(dutyRoster[i+'_'+d])dutyCount++;}));
 let scoreTxt='';let fsum=0,lsum=0,classWeak=[];
 if(scores.length){const exams=[...new Set(scores.map(r=>r.exam))];const first=exams[0],last=exams[exams.length-1];
  fsum=avgTotal(first);lsum=avgTotal(last);
  const subs=[...new Set(scores.map(r=>r.subject))];
  classWeak=subs.map(su=>{const arr=scores.filter(r=>r.subject==su).map(r=>r.score/(maxOf(last,su)||100)*100);return {su,avg:arr.reduce((a,b)=>a+b,0)/arr.length};}).sort((a,b)=>a.avg-b.avg).slice(0,2);
  scoreTxt='本学期共 '+exams.length+' 次主要考试（'+exams.join('、')+'）。班级中考总分均值为「'+first+'」'+fsum+' 分 →「'+last+'」'+lsum+' 分（'+(lsum>=fsum?'稳中有升':'仍有提升空间')+'）；相对薄弱：'+(classWeak.map(w=>w.su).join('、')||'无明显短板')+'。';
 }else scoreTxt='暂未录入成绩数据。';
 const H='<h2 style="text-align:center;margin:4px 0 2px">'+esc(teacher+' · '+(s.className||'本班')+' 学期工作报表')+'</h2><div style="text-align:center;color:#7a8aa0;margin-bottom:14px">'+esc(sem)+'　'+esc(s.school||'')+'</div>';
 const sec=(t,body)=>'<h3 style="border-left:4px solid #1f6fb2;padding-left:8px;margin:18px 0 8px;font-size:15px">'+esc(t)+'</h3>'+body;
 let html=H;
 html+=sec('一、班级概况','全班 '+st.length+' 人（男 '+boys+' / 女 '+(st.length-boys)+'），本地生源 '+st.filter(x=>x.origin=='本地').length+' 人、外地 '+st.filter(x=>x.origin=='外地').length+' 人；配备全员导师 '+((load('mentorList',[])||[]).length)+' 名。');
 html+=sec('二、学业情况',scoreTxt);
 html+=sec('三、荣誉与成果','集体荣誉 '+(honor.length?Object.entries(honorByType).map(([k,v])=>k+' '+v+' 次').join('、'):'暂无登记')+'；学生个人获奖 '+awards.length+' 人次'+(awards.length?('（如：'+awards.slice(0,5).map(a=>a.student+a.name).join('、')+'）'):'')+'。');
 html+=sec('四、行规与德育','学期共 '+viol.length+' 起行规记录（'+(Object.entries(violTypes).map(([k,v])=>k+' '+v+' 起').join('、')||'无')+'），均教育跟进、留痕可查。');
 html+=sec('五、沟通与关怀','导师 / 班主任谈话 '+talk.length+' 次、家访或家校沟通 '+visit.length+' 次、全员导师制记录 '+mentor.length+' 条。');
 html+=sec('六、工作留痕（'+worklog.length+' 项）',wbCats.length?('分板块：'+wbCats.map(c=>c+' '+(wlByCat[c]||0)+' 项').join('、')+(worklog.length?'。':'（暂无记录）')):'（尚未设置板块）');
 html+=sec('七、安全与卫生','安全台账 '+safety.length+' 条；卫生值日累计排班 '+dutyCount+' 人次（'+dutyTasks.length+' 项值日内容常态化运转）。');

function cmtOpts(){const all=['character','study','score','classwork','conduct','pe','peers','award','home','weak'];const secs=all.filter(k=>{const el=$('#cmt_'+k);return el&&el.checked;});const fmt=$('#cmtFmtCard')&&$('#cmtFmtCard').checked?'card':'table';const len=Math.max(50,Math.min(600,parseInt($('#cmtLen')&&$('#cmtLen').value,10)||150));return {sections:secs.length?secs:all,fmt,targetLen:len};}
function buildComment(s,opt){opt=opt||{sections:['character','study','score','classwork','conduct','pe','peers','award','home','weak'],idx:0,targetLen:null};const name=s.name;const idx=opt.idx||0;const sec=new Set(opt.sections);const parts=[];
 const role=s.role||'';const tag=(s.tags||[])[0]||'';
 if(sec.has('character')){let ch;const m=idx%3;const trait=s.personality||'';const note=s.remark||'';
  if(m===0){ch='';if(role)ch+='作为'+role+'，';if(trait)ch+='你'+trait+'，';ch+='待人诚恳、做事靠谱，小伙伴有事儿都爱找你搭把手，老师看着也欢喜。';}
  else if(m===1){ch='';if(trait)ch+='你是'+trait+'的孩子，';else if(tag)ch+='你是班里有名的'+tag+'，';else ch+='你是个温润真诚的孩子，';ch+='和同学相处总是暖暖的，班里气氛因你轻松不少。';}
  else {ch='你有着自己鲜明的性格';if(trait)ch+='——'+trait;ch+='，或安静沉稳、或开朗爱笑，在老师眼里都是很珍贵的样子，慢慢长成你自己就好。';}

  parts.push(ch);}
 if(sec.has('study')){const v=[
   '学习上你有一股子钻劲儿，作业从不敷衍，遇到不会的总愿意多问一句，这份踏实最让老师放心。',
   '对待学习你态度认真，课堂专注、作业工整，一步一个脚印，老师都看在眼里。',
   '你不是最拔尖的那一个，但学习上的用功和坚持，老师一直记着，这比一时的分数更可贵。'
 ][idx%3];parts.push(v);}
 if(sec.has('score')){const b=stuExamBrief(name);
  if(b){const rankInfo='，班级第 '+b.rank+' 名（共 '+b.total+' 人）'+(b.deltaRank!=null?(b.deltaRank>0?'，比上次进步了 '+b.deltaRank+' 名':b.deltaRank<0?'，比上次退步了 '+Math.abs(b.deltaRank)+' 名':'，名次和上次持平'):'');
   const trend=(b.deltaSum!=null)?(b.deltaSum>=0?'，和上次比总分还往上走了 '+b.deltaSum+' 分':'，和上次比暂时差了 '+Math.abs(b.deltaSum)+' 分，咱们一起找找原因'):'';
   const v=['这学期的考试，你总分考了 '+b.sum+' 分（满分约 '+b.fullMax+' 分，得分率 '+b.rate.toFixed(0)+'%）'+rankInfo+'，「'+b.strong.su+'」学得最扎实（得分率 '+b.strong.rate.toFixed(0)+'%）'+trend+'，老师都看在眼里。',
    '翻看几次成绩，你最近一次总分 '+b.sum+' 分（满分约 '+b.fullMax+' 分）'+rankInfo+'，其中「'+b.strong.su+'」表现最亮眼（得分率 '+b.strong.rate.toFixed(0)+'%）'+trend+'，真不错。',
    '说说考试：你最近总分 '+b.sum+' 分（满分约 '+b.fullMax+' 分）'+rankInfo+'，「'+b.strong.su+'」是你拿手的科目（得分率 '+b.strong.rate.toFixed(0)+'%）'+trend+'，保持住！'][idx%3];parts.push(v);
  }else parts.push('这学期学业上的成绩数据老师还没收集全，但老师看到你一直在努力，这比分数更让老师欣慰。');}
 if(sec.has('classwork')){const v=[
   '课堂上你眼神跟着老师走，作业也交得勤快工整，这份自觉让老师很省心。',
   '听课时你总爱琢磨，作业写得认真，遇到难题也肯钻，学习习惯很不错。',
   '你在课堂上愿意举手、课后作业不拖拉，这点老师要给你点个赞。'][idx%3];parts.push(v);}
 if(sec.has('conduct')){const viol=load('violation',[]).filter(r=>r.student==name);
  if(viol.length){const vt=viol.map(v=>v.type).join('、');const v=[
    '行规上这学期有 '+viol.length+' 次小状况（'+vt+'），老师知道你不是故意的，慢慢学着管好自己，你一定行。',
    '纪律方面冒出来 '+viol.length+' 次小插曲（'+vt+'），别着急，咱们一点点改，你准能行。',

  else{const v=[
    '行规方面你特别让老师省心，守纪律、懂分寸，是班里大家信得过的正能量担当。',
    '在行规上你一直稳稳当当，守规矩又有礼貌，是同学们都服气的好榜样。',

 if(sec.has('pe')){const v=[
   '体育和体艺活动里，你总带着一股活力，跑跳之间透着少年该有的精气神，老师喜欢看你动起来的样子。',

 if(sec.has('peers')){const v=[
   '你和同学处得特别好，谁有困难你都愿意搭把手，人缘好不是没道理的。',
   '在集体里你像个开心果，和谁都能聊到一块儿，班级氛围因你更暖。',
   '你待人真诚，朋友不少，能和同伴和睦相处，这也是一种很棒的能力。'][idx%3];parts.push(v);}
 if(sec.has('award')){const awards=load('stuAward',[]).filter(a=>a.student==name);
  if(awards.length)parts.push('在校期间你还拿下了'+awards.map(a=>a.level+a.name).join('、')+'，真为你高兴，这些闪光点要继续闪光呀。');
  else parts.push('虽然不是每块奖牌都写着你名字，但你平时的认真和善良，就是最亮眼的闪光点。');}
 if(sec.has('home')){const talk=load('talk',[]).filter(r=>r.student==name);const visit=load('visit',[]).filter(r=>r.student==name);const care=talk.length+visit.length;
  if(care)parts.push('老师也通过 '+care+' 次谈话 / 家访走近你，看到你成长里的点滴，家校这条线一直很顺、很暖。');
  else{const mt=s.mentor?('你的导师'+s.mentor+'也一直关注着你'):'';parts.push('平时家校沟通顺畅，'+mt+'，有什么事咱们随时聊，一起把孩子往前带。');}}
 if(sec.has('weak')){const b=stuExamBrief(name);let focus='';
  if(b&&b.weak)focus='假期里建议把更多精力放在「'+b.weak.su+'」上（这次得分率只有 '+b.weak.rate.toFixed(0)+'%），从基础题和小练习抓起，错题多面批、多回看，慢慢就上来了。';
  if(!focus){const alt=['有空多举手发言，胆子大一点，你的想法其实很棒。','试着把时间规划得更细些，效率会更高。','遇到不懂的别憋着，多问一句，路就宽了。'];focus=alt[idx%alt.length];}
  const v=['说点心里话：'+focus+'老师提这些，是真心盼着你更好，别往心里去哈。',
   '也想悄悄提醒你：'+focus+'这不是缺点，只是还能更亮的地方。',
   '最后啰嗦一句：'+focus+'老师相信你做得到，咱们一起努把力。'][idx%3];parts.push(v);}
 const opens=[''+name+'同学：','写给'+name+'同学：',name+'：'];
 const closings=['新学期咱们一起加油，老师陪着你，慢慢遇见更好的自己呀！','新的学期，老师盼着你继续发光，咱们一块儿往前走～','往后日子，老师会一直站在你身后，看着你一点点长成喜欢的样子！'];
 let text=opens[idx%opens.length]+parts.join('')+closings[idx%closings.length];
 const tl=opt.targetLen;
 if(tl&&tl>0&&[...text].length>tl){
   const headLen=[...opens[idx%opens.length]].length,tailLen=[...closings[idx%closings.length]].length;
   let room=tl-headLen-tailLen;if(room<10)room=10;
   const keep=parts.slice();let midLen=keep.reduce((a,p)=>a+[...p].length,0);
   while(keep.length>1&&midLen>room){const d=keep.pop();midLen-=[...d].length;}
   let mid=keep.join('');
   if([...mid].length>room){const last=keep[keep.length-1];let cut=last.lastIndexOf('，',room);if(cut<2)cut=room;keep[keep.length-1]=[...last].slice(0,Math.max(cut,1)).join('');mid=keep.join('');}
   text=opens[idx%opens.length]+mid+closings[idx%closings.length];
 }
 return text;
}

function genCase(){const id=$('#csStu').value;const s=stuById(id);if(!s)return;const name=s.name;
 const scores=load('scores',[]).filter(r=>r.name==name);
 let learn='';
 if(scores.length){const exams=[...new Set(scores.map(r=>r.exam))];const last=exams[exams.length-1],first=exams[0];
  const lastSum=scores.filter(r=>r.exam==last).reduce((a,b)=>a+b.score,0);const firstSum=scores.filter(r=>r.exam==first).reduce((a,b)=>a+b.score,0);
  const subs=[...new Set(scores.map(r=>r.subject))];const stat=subs.map(su=>{const arr=scores.filter(r=>r.subject==su).map(r=>r.score/(maxOf(last,su)||100)*100);return {su,avg:arr.reduce((a,b)=>a+b,0)/arr.length};}).sort((a,b)=>a.avg-b.avg);
  const b=stuExamBrief(name);
  learn='学业上，孩子从「'+first+'」的 '+firstSum+' 分，到「'+last+'」的 '+lastSum+' 分，'+(lastSum>=firstSum?'能看到一步一个脚印的进步':'中间有起有伏，正是需要我们多搭把手的时候')+'；相对吃力的学科主要是'+(stat.slice(0,2).map(w=>w.su).join('、')||'目前看不出明显短板')+(b&&b.strong?('，而「'+b.strong.su+'」是ta最拿手的科目（最近一次得分率 '+b.strong.rate.toFixed(0)+'%）'):'')+'。';
 }else learn='学业方面：暂未录入成绩数据。';
 const viol=load('violation',[]).filter(r=>r.student==name);
 const violTxt=viol.length?('行规上，前后有 '+viol.length+' 次小插曲（'+viol.map(v=>v.type+'：'+(v.punish||'已及时谈心引导')).join('；')+'），说明孩子在'+([...new Set(viol.map(v=>v.type))].join('、')+'上还有成长空间，也是咱们重点帮他的地方。')):'行规上，这孩子守纪律、靠得住，状态一直很稳。';
 const talk=load('talk',[]).filter(r=>r.student==name);const visit=load('visit',[]).filter(r=>r.student==name);const mentor=load('mentor',[]).filter(r=>r.student==name);
 const awards=load('stuAward',[]).filter(a=>a.student==name);
 const care='这阵子，导师和班主任前前后后跟他聊了 '+(talk.length+mentor.length)+' 次、家访或电话沟通 '+visit.length+' 次'+(awards.length?('，也留心着他的闪光点——拿到过'+awards.map(a=>a.name).join('、')+'等奖'):'')+'，就是想多走近他一点。';
 const teacher=load('settings',{}).teacher||'班主任';const school=load('settings',{}).school||'';
 const txt='【育人案例】'+name+'同学个案\n班级：'+(load('settings',{}).className||'')+'　导师：'+(s.mentor||'—')+'\n\n一、案例背景\n'+name+'同学，性别'+(s.gender||'—')+'，担任'+(s.role||'普通同学')+(s.origin?('，生源为'+s.origin):'')+'。'+learn+'\n\n二、问题表征\n'+violTxt+'\n\n三、干预与跟进\n'+care+'主要谈话主题包括：'+([...new Set([...talk,...mentor].map(r=>r.topic))].join('、')||'（暂无记录）')+'；家访 / 沟通重点：'+(visit.map(v=>v.content).join('；')||'（暂无记录）')+'。\n\n四、成效与反思\n靠着老师多盯、家里多配合，孩子在'+(viol.length?'规矩意识和学习习惯':'整体状态')+'上一点点往好的方向走。回头想想，育人这件事，说到底就是“把每个孩子都放在心上”——有全员导师制托着，早点发现、早点拉一把、多给点肯定，孩子自然就长起来了。\n\n——'+teacher+'　'+school+'　'+todayStr();
 $('#csOut').value=txt;toast('育人案例已生成');
}

 ['timetable','classTimetable'].forEach(k=>{
   const t=load(k,null);if(!t||!Array.isArray(t.periods))return;
   if(t.periods.includes('早读'))return;
   const oldG=t.grid||{};const newG={};
   Object.keys(oldG).forEach(key=>{const p=key.split('_');const oi=+p[0];const nd=oi + 1 + (oi>=5?1:0);newG[nd+'_'+p.slice(1).join('_')]=oldG[key];});
   t.periods=['早读','1','2','3','4','5','午自习','6','7','课后服务'];t.grid=newG;save(k,t);
 });
 const st=load('students',[]);let changed=false;
 st.forEach(s=>{if(s.origin===undefined||s.contacts===undefined){changed=true;
   if(s.origin===undefined)s.origin=(s.group&&/外/.test(s.group))?'外地':'本地';
   if(s.points===undefined)s.points=0;
   if(s.contacts===undefined)s.contacts=[{name:s.parent||'家长1',phone:s.phone||''},{name:'',phone:''}];
   delete s.group;delete s.parent;delete s.phone;delete s.relation;}});
 if(changed)save('students',st);
}
/* 二次迁移：座位改为一桌一人；课表午自习移到第4节后；课表单元格支持“科目+老师” */
function migrate2(){
 if(load('migrated_v2'))return;save('migrated_v2',1);
 /* 1) 座位：把旧的多人桌摊平成一桌一人 */
 const s=load('seats',null);
 if(s&&Array.isArray(s.desks)){
   const flat=[];s.desks.forEach(d=>{let a=d.students;if(!Array.isArray(a))a=[a];a.forEach(x=>{if(x)flat.push(x);});});
   const rows=Math.max(6,Math.ceil(flat.length/8)),cols=8;
   const nd={rows,cols,aisleBefore:[2,4,6],desks:[]};
   for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)nd.desks.push({id:'d'+r+'_'+c,r,c,students:[null]});
   flat.forEach((sid,i)=>{if(i<nd.desks.length)nd.desks[i].students[0]=sid;});
   save('seats',nd);
 }
 /* 2) 课表节次顺序：早读,1,2,3,4,午自习,5,6,7,课后服务 */
 const TARGET=['早读','1','2','3','4','午自习','5','6','7','课后服务'];
 ['timetable','classTimetable'].forEach(k=>{
   const t=load(k,null);if(!t)return;const old=t.periods||[];
   if(JSON.stringify(old)===JSON.stringify(TARGET)){t.grid=lessonNorm(t.grid);save(k,t);return;}
   const oldG=t.grid||{};const newG={};
   Object.keys(oldG).forEach(key=>{const p=key.split('_');const oi=+p[0];const label=old[oi];const ni=TARGET.indexOf(label);if(ni>=0)newG[ni+'_'+p.slice(1).join('_')]=oldG[key];});
   t.periods=TARGET.slice();t.grid=lessonNorm(newG);save(k,t);
 });
}
/* 课表单元格统一为 {s:科目,t:老师} */
function lessonNorm(g){const o={};Object.keys(g||{}).forEach(k=>{const v=g[k];o[k]=(v&&typeof v==='object')?{s:v.s||'',t:v.t||''}:{s:String(v||''),t:''};});return o;}
function lessonOf(g,k){const v=(g||{})[k];if(!v)return null;return (typeof v==='object')?{s:v.s||'',t:v.t||''}:{s:String(v),t:''};}
/* 清空旧版 seed 写入的示例学生及关联记录（保留课表/设置等框架配置），仅执行一次 */
function migrate3(){
 if(load('migrated_blank'))return;save('migrated_blank',1);
 ['students','scores','violation','talk','visit','mentor','leave','homework','stuAward','honor','todos','worklog','safety','schedule'].forEach(k=>{if(load(k,null)!=null)save(k,[]);});
 const s=load('seats',null);if(s&&s.desks){s.desks.forEach(d=>{d.students=[null];});save('seats',s);}
}
/* 班级课表改为默认空白（清掉旧版 seed 写入的示例课表，仅执行一次） */
function migrate4(){
 if(load('migrated_tt_blank'))return;save('migrated_tt_blank',1);
 const TARGET=['早读','1','2','3','4','午自习','5','6','7','课后服务'];
 const t=load('classTimetable',null);
 if(t){t.days=['周一','周二','周三','周四','周五'];t.periods=TARGET.slice();t.grid={};save('classTimetable',t);}
}
function migrate5(){
 if(load('migrated_st_blank'))return;save('migrated_st_blank',1);
 const st=load('subjectTeachers',null);
 if(st && st['语文']==='姜黎莲') save('subjectTeachers',{});
}
function migrate6(){
 if(load('migrated_duty_obj'))return;save('migrated_duty_obj',1);
 const t=load('dutyTasks',null);
 if(!Array.isArray(t))return;
 const isOldDefault=t.length===6&&t.every(x=>typeof x==='string')&&t.join('、')==='扫地、拖地、擦黑板、倒垃圾、摆桌椅、窗台/走廊';
 if(isOldDefault) save('dutyTasks',defDutyTasks());
}

/* ============ 顶栏 / 导航 / 渲染 ============ */
function topbar(){const s=load('settings',{});const tname=s.teacher||'';
 $('#brandName').innerHTML=esc(tname?tname+' 的工作台':'智慧班主任工作台')+'<small>上海公办初中 · 班级工作台</small>';
 $('#clsTitle').textContent=tname?tname+' 的工作台':(s.className||'班级工作台');}
function buildNav(){let html='',lastG=null;
 NAV.forEach(n=>{if(n.g&&n.g!==lastG){html+='<div class="nav-group">'+n.g+'</div>';lastG=n.g;}
  html+='<div class="nav-item" data-page="'+n.k+'">'+ic(n.i)+'<span>'+n.t+'</span></div>';});
 $('#nav').innerHTML=html;
 $$('#nav .nav-item').forEach(a=>a.onclick=()=>nav(a.dataset.page));}
function render(){const cur=$('.nav-item.active');const page=cur?cur.dataset.page:'dash';(pages[page]||dash)();window.scrollTo(0,0);}
function setBotActive(page){const m={dash:'dash',students:'students',duty:'duty',talk:'talk',worklog:'worklog',settings:'settings'};$$('#botnav .bn').forEach(a=>a.classList.toggle('on',a.dataset.k===m[page]));}
function nav(page){$$('.nav-item').forEach(a=>a.classList.toggle('active',a.dataset.page==page));$('#sidebar').classList.remove('open');$('#scrim2').classList.remove('show');setBotActive(page);(pages[page]||dash)();window.scrollTo(0,0);}
function doSyncTap(){const c=syncConf();const base=syncUrl(c);if(c.key&&base){toast('同步中…');pullSync(()=>{pushSync(ok=>toast(ok?'已同步 ✓':'同步失败，检查网络/服务是否开着'));});}else{openSync();}}
function buildBotNav(){const items=getBotNavItems();const labels={dash:'桌面',students:'学生',scores:'成绩',homework:'作业',seating:'座位',leave:'请假',timetable:'课表',duty:'值日',homeschool:'家校',talk:'谈话',visit:'家访',violation:'违纪',safety:'安全',worklog:'留痕',schedule:'日程',honor:'荣誉',stuAward:'获奖',termComment:'评语',caseStudy:'案例',termSummary:'总结',termReport:'报表',mentor:'导师',settings:'设置'};const B=items.map(k=>{const n=NAV.find(x=>x.k===k);return {k,t:labels[k]||(n?n.t:k),i:n?n.i:'dash'};});$('#botnav').innerHTML=B.map(b=>'<div class="bn" data-k="'+b.k+'">'+ic(b.i)+'<span class="bnl">'+b.t+'</span></div>').join('');$$('#botnav .bn').forEach(a=>a.onclick=()=>{const k=a.dataset.k;if(k==='__more'){$('#sidebar').classList.add('open');$('#scrim2').classList.add('show');return;}nav(k);});}
function clock(){const d=new Date();$('#clock').textContent=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');const dc=$('#dashClock');if(dc){dc.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}}

pages.dash=dash;pages.students=studentsPage;pages.scores=scoresPage;pages.homework=homeworkPage;pages.leave=leavePage;
pages.worklog=worklogPage;pages.violation=violationPage;pages.talk=talkPage;pages.visit=visitPage;pages.mentor=mentorPage;
pages.homeschool=homeschoolPage;pages.safety=safetyPage;pages.schedule=schedulePage;pages.afterschool=afterschoolPage;
pages.timetable=timetablePage;pages.seating=seatingPage;pages.duty=dutyPage;pages.elective=electivePage;
pages.honor=honorPage;pages.stuAward=stuAwardPage;pages.termSummary=termSummaryPage;pages.termComment=termCommentPage;pages.caseStudy=caseStudyPage;pages.termReport=termReportPage;
pages.settings=settingsPage;

$('#menuBtn').onclick=()=>{$('#sidebar').classList.toggle('open');$('#scrim2').classList.toggle('show');};
$('#scrim2').onclick=()=>{$('#sidebar').classList.remove('open');$('#scrim2').classList.remove('show');};
$('#expBtn').onclick=expData;$('#impBtn').onclick=()=>$('#impFile').click();bindImport('impFile',importData);

seed();migrate();migrate2();migrate3();migrate4();migrate5();migrate6();worklogCatsInit();buildNav();buildBotNav();setBotActive('dash');topbar();dash();clock();setInterval(clock,1000);
(function syncBoot(){const sc=syncConf();_syncOn=!!sc.on;setSyncDot('idle');if(_syncOn){_lastPull=0;pullSync(()=>{if(_lastChange>_lastPull)pushSync();});}setInterval(syncTick,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&_syncOn)syncTick();});})();
